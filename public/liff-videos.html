<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f37">
  <meta name="description" content="Joson-Care 官方 YouTube 影音頻道">
  <title>Joson-Care 影音頻道</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/liff-videos.css">
  <script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script defer src="/liff-videos.js"></script>
</head>
<body>
  <header class="channel-hero">
    <div class="brand-row">
      <span class="brand-mark" aria-hidden="true">J</span>
      <div><b>JOSON CARE</b><small>溫馨照護・安心陪伴</small></div>
    </div>
    <div class="hero-copy">
      <span>OFFICIAL VIDEO CHANNEL</span>
      <h1>照護影音頻道</h1>
      <p>在 LINE 裡直接觀看產品操作、展會紀錄與居家照護資訊。</p>
    </div>
    <div class="liff-state" id="liff-state">正在連接 LINE LIFF…</div>
  </header>

  <main>
    <section class="channel-head">
      <div><small>分類影音</small><h2>Joson-Care YouTube</h2></div>
      <a id="channel-link" href="https://www.youtube.com/channel/UClq-e-Ve7LZ0Dx1o5pPruwA" target="_blank" rel="noopener noreferrer">前往官方頻道 ↗</a>
    </section>
    <nav id="video-categories" class="category-tabs" aria-label="影片分類"></nav>
    <section id="video-list" class="video-grid" aria-live="polite">
      <div class="loading"><span></span>正在載入最新影片…</div>
    </section>
  </main>

  <footer>
    <p>更多 Joson-Care 最新消息</p>
    <nav aria-label="官方社群">
      <a href="https://www.facebook.com/JosonCare" target="_blank" rel="noopener noreferrer">Facebook</a>
      <a href="https://www.youtube.com/channel/UClq-e-Ve7LZ0Dx1o5pPruwA" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="https://www.linkedin.com/company/joson-care/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>
  </footer>

  <section class="player-dialog" id="player-dialog" hidden>
    <button class="player-backdrop" type="button" data-close-player aria-label="關閉影片"></button>
    <article role="dialog" aria-modal="true" aria-labelledby="player-title">
      <button class="player-close" type="button" data-close-player aria-label="關閉影片">×</button>
      <div class="player-frame" id="player-frame"></div>
      <h2 id="player-title"></h2>
    </article>
  </section>
</body>
</html>
